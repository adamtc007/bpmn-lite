[package]
name = "bpmn-lite-server-designer"
version = "0.1.0"
edition = "2021"

[features]
default = []
# DIR-004 Phase 1.2: forwards to utterance-engine's Q9-gated capture
# module. NOT in `default` -- deliberately absent from every documented
# build/release command in this repo (scripts/check-q9-capture-gate.sh
# enforces that). A default server build has no live user-capture path.
q9-capture = ["utterance-engine/q9-capture"]

[dependencies]
bpmn-lite-types = { path = "../bpmn-lite-types" }
bpmn-lite-compiler = { path = "../bpmn-lite-compiler" }
designer-graph = { path = "../designer-graph" }
utterance-engine = { path = "../utterance-engine" }
bpmn-lite-store = { path = "../bpmn-lite-store" }
bpmn-lite-authoring = { path = "../bpmn-lite-authoring" }
dmn-lite-parser = { path = "../dmn-lite-parser" }
dsl-manifest = { path = "../dsl-manifest" }
async-trait = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
serde_json = { workspace = true }
hex = "0.4"
blake3 = { workspace = true }
futures = "0.3"
axum = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tower = { version = "0.4", features = ["util"] }

[lints]
workspace = true
