<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BPMN-Lite Designer</title>
<style>
  :root { --bg:#11151c; --panel:#1a2029; --line:#2c3644; --text:#d7dde6; --dim:#8a97a8; --accent:#5aa9e6; --ok:#63c776; --warn:#e6b45a; --err:#e66a6a; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; }
  header { padding:10px 16px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:center; }
  header h1 { font-size:15px; margin:0; font-weight:600; }
  header .hint { color:var(--dim); font-size:12px; }
  main { flex:1; display:grid; grid-template-columns: 230px 1fr 1fr; min-height:0; }
  section { border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
  section h2 { font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); margin:0; padding:10px 12px 6px; }
  #sessions { overflow-y:auto; flex:1; }
  #sessions button.sess { display:block; width:100%; text-align:left; background:none; border:none; border-bottom:1px solid var(--line); color:var(--text); padding:8px 12px; cursor:pointer; font-size:13px; }
  #sessions button.sess.active { background:var(--panel); border-left:3px solid var(--accent); }
  .pad { padding:10px 12px; }
  input[type=text], textarea { width:100%; background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:4px; padding:7px 9px; font:13px ui-monospace, monospace; }
  textarea { resize:vertical; }
  button.act { background:var(--accent); color:#0b0e13; border:none; border-radius:4px; padding:7px 12px; font-weight:600; cursor:pointer; }
  button.act.secondary { background:var(--panel); color:var(--text); border:1px solid var(--line); }
  #repl-log { flex:1; overflow-y:auto; padding:10px 12px; display:flex; flex-direction:column; gap:8px; }
  .msg { border:1px solid var(--line); border-radius:6px; padding:8px 10px; background:var(--panel); }
  .msg .who { font-size:11px; color:var(--dim); margin-bottom:3px; }
  .msg.user { border-left:3px solid var(--accent); }
  .msg.system { border-left:3px solid var(--warn); }
  .msg .meta { font-size:11px; color:var(--dim); margin-top:5px; font-family:ui-monospace, monospace; word-break:break-all; }
  #graph-wrap { flex:1; overflow:auto; background:var(--bg); }
  #diagnostics { color:var(--err); font:12px ui-monospace, monospace; padding:8px 12px; white-space:pre-wrap; }
  .row { display:flex; gap:8px; padding:8px 12px; align-items:center; }
  .badge { font-size:11px; padding:2px 7px; border-radius:9px; border:1px solid var(--line); color:var(--dim); }
  .badge.ok { color:var(--ok); border-color:var(--ok); }
  svg .node rect { fill:var(--panel); stroke:var(--line); rx:6; }
  svg .node.start rect, svg .node.end rect { stroke:var(--ok); }
  svg .node.split rect, svg .node.join rect { fill:#232b36; stroke:var(--warn); }
  svg .node text { fill:var(--text); font:11px -apple-system, sans-serif; }
  svg .edge { stroke:var(--dim); stroke-width:1.3; fill:none; marker-end:url(#arrow); }
</style>
</head>
<body>
<header>
  <h1>BPMN-Lite Designer</h1>
  <span class="hint">the graph is a window — all changes go through the REPL and governed endpoints</span>
  <span id="capture-badge" class="badge" title="D17: corpus capture requires the ratified Q9 charter">capture: —</span>
</header>
<main>
  <section id="left">
    <h2>Sessions</h2>
    <div class="row">
      <input type="text" id="new-name" placeholder="new session name">
      <button class="act" id="create-btn">＋</button>
    </div>
    <div id="sessions"></div>
  </section>
  <section id="mid">
    <h2>REPL <span id="sess-label" class="badge">no session</span></h2>
    <div id="repl-log"></div>
    <div class="row">
      <input type="text" id="utter-input" placeholder="describe a design step…">
      <button class="act" id="utter-btn">Send</button>
    </div>
    <h2>Source (revision on apply)</h2>
    <div class="pad">
      <textarea id="src" rows="8" spellcheck="false"></textarea>
      <div class="row" style="padding:8px 0 0">
        <button class="act secondary" id="rev-btn">Apply revision</button>
        <input type="text" id="tpl-name" placeholder="template name">
        <button class="act" id="save-btn">Save as template</button>
      </div>
    </div>
  </section>
  <section id="right" style="border-right:none">
    <h2>Graph <span id="compile-badge" class="badge">—</span></h2>
    <div id="diagnostics" hidden></div>
    <div id="graph-wrap"><svg id="graph" width="1200" height="800">
      <defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8a97a8"/></marker></defs>
      <g id="edges"></g><g id="nodes"></g>
    </svg></div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
let current = null;

async function api(path, opts) {
  const r = await fetch(path, opts ? { headers: {'Content-Type':'application/json'}, ...opts } : undefined);
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.error || r.statusText);
  return body;
}

async function loadSessions() {
  const list = await api('/api/dsl/sessions');
  const box = $('sessions'); box.innerHTML = '';
  for (const s of list) {
    const b = document.createElement('button');
    b.className = 'sess' + (current === s.id ? ' active' : '');
    b.textContent = `${s.name} · r${s.revisions}`;
    b.onclick = () => select(s.id, s.name);
    box.appendChild(b);
  }
}

async function select(id, name) {
  current = id;
  $('sess-label').textContent = name;
  const rec = await api(`/api/dsl/sessions/${id}`);
  const log = $('repl-log'); log.innerHTML = '';
  let lastSource = '';
  for (const ev of rec.events) {
    if (ev.kind.Revision) lastSource = ev.kind.Revision.dsl_source;
    if (ev.kind.Utterance) {
      addMsg('user', ev.kind.Utterance.text);
      addMsg('system', ev.kind.Utterance.response);
    }
  }
  $('src').value = lastSource;
  await loadSessions();
  await refreshGraph();
}

function addMsg(who, text, meta) {
  const d = document.createElement('div');
  d.className = 'msg ' + who;
  d.innerHTML = `<div class="who">${who === 'user' ? 'you' : 'designer'}</div>` +
    `<div>${text.replace(/</g,'&lt;')}</div>` + (meta ? `<div class="meta">${meta}</div>` : '');
  $('repl-log').appendChild(d);
  $('repl-log').scrollTop = 1e9;
}

async function refreshGraph() {
  if (!current) return;
  const g = await api(`/api/dsl/sessions/${current}/graph`);
  $('compile-badge').textContent = g.compiles ? 'compiles' : 'diagnostics';
  $('compile-badge').className = 'badge' + (g.compiles ? ' ok' : '');
  $('diagnostics').hidden = g.compiles;
  $('diagnostics').textContent = (g.diagnostics || []).join('\n');
  const nodesG = $('nodes'), edgesG = $('edges');
  nodesG.innerHTML = ''; edgesG.innerHTML = '';
  if (!g.compiles || !g.graph) return;
  const pos = {}; const W = 150, H = 44, PAD = 40;
  for (const n of g.graph.nodes) {
    const p = g.layout[n.id] || {x:0, y:0};
    pos[n.id] = { x: p.x + PAD, y: p.y + PAD };
  }
  for (const e of g.graph.edges) {
    const a = pos[e.from], b = pos[e.to];
    if (!a || !b) continue;
    const path = document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('class','edge');
    path.setAttribute('d', `M${a.x + W},${a.y + H/2} C${a.x + W + 40},${a.y + H/2} ${b.x - 40},${b.y + H/2} ${b.x},${b.y + H/2}`);
    edgesG.appendChild(path);
  }
  for (const n of g.graph.nodes) {
    const p = pos[n.id];
    const grp = document.createElementNS('http://www.w3.org/2000/svg','g');
    grp.setAttribute('class', `node ${n.kind}`);
    grp.setAttribute('transform', `translate(${p.x},${p.y})`);
    grp.innerHTML = `<rect width="${W}" height="${H}" rx="6"></rect>` +
      `<text x="8" y="18">${(n.label||n.id).slice(0,22).replace(/</g,'&lt;')}</text>` +
      `<text x="8" y="34" fill-opacity="0.55">${n.id.slice(0,22)}</text>`;
    grp.querySelector('rect').append();
    nodesG.appendChild(grp);
  }
}

$('create-btn').onclick = async () => {
  const name = $('new-name').value.trim() || 'untitled';
  const r = await api('/api/dsl/sessions', { method:'POST', body: JSON.stringify({ name, dsl_source: '' }) });
  $('new-name').value = '';
  await loadSessions();
  await select(r.session_id, name);
};

$('utter-btn').onclick = async () => {
  if (!current) return alert('select a session');
  const text = $('utter-input').value.trim();
  if (!text) return;
  $('utter-input').value = '';
  addMsg('user', text);
  try {
    const r = await api(`/api/dsl/sessions/${current}/utterance`, { method:'POST', body: JSON.stringify({ text }) });
    const dispo = typeof r.disposition === 'string' ? r.disposition : Object.keys(r.disposition)[0];
    addMsg('system', r.message, `disposition: ${dispo} · board ${r.board_hash.slice(0,12)}… · capture ${r.capture}`);
    $('capture-badge').textContent = 'capture: ' + r.capture;
  } catch (e) { addMsg('system', 'error: ' + e.message); }
};
$('utter-input').addEventListener('keydown', e => { if (e.key === 'Enter') $('utter-btn').onclick(); });

$('rev-btn').onclick = async () => {
  if (!current) return alert('select a session');
  const r = await api(`/api/dsl/sessions/${current}/revision`, { method:'POST', body: JSON.stringify({ dsl_source: $('src').value, note: 'ui edit' }) });
  addMsg('system', r.compiles ? `revision ${r.seq} recorded — compiles clean` : `revision ${r.seq} recorded — diagnostics:\n` + r.diagnostics.join('\n'));
  await refreshGraph(); await loadSessions();
};

$('save-btn').onclick = async () => {
  if (!current) return alert('select a session');
  const name = $('tpl-name').value.trim();
  if (!name) return alert('template name required');
  try {
    const r = await api(`/api/dsl/sessions/${current}/save`, { method:'POST', body: JSON.stringify({ template_name: name }) });
    addMsg('system', `saved as template '${r.template_name}' v${r.version} — plan ${r.plan_hash.slice(0,12)}…`);
  } catch (e) { addMsg('system', 'save refused: ' + e.message); }
};

loadSessions();
</script>
</body>
</html>
