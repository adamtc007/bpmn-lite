[package]
name = "bpmn-lite-authoring-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.bpmn-lite-authoring]
path = ".."

[[bin]]
name = "yaml_workflow_parse"
path = "fuzz_targets/yaml_workflow_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "zeebe_bpmn_import"
path = "fuzz_targets/zeebe_bpmn_import.rs"
test = false
doc = false
bench = false
