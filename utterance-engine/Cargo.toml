[package]
name = "utterance-engine"
version = "0.1.0"
edition = "2021"
description = "WS-C (EOP-PLAN-BPMN-DESIGN-003): board construction, stable SLM contract, deterministic disposition policy, I28 records. Models supply evidence; policy issues dispositions (I27)."

[features]
# The Candle embed-and-score tier-0 producer (ruling E3). Off by default:
# it pulls the BGE model weights via hf-hub on first use (~130MB cache) —
# CI and default builds stay network-free; enable for the embedder
# producer and its #[ignore] integration test.
embed = ["dep:ob-semantic-matcher"]
# DIR-002 Phase C, step 0: T3.4a shortlist loadability receipts ("verified
# not assumed" per the plan). Independent of `embed` — probes candle-transformers
# directly against each shortlisted base's real HF checkpoint, no ob-semantic-matcher
# involvement (that crate only ever loads BGE). Off by default: pulls each base's
# weights via hf-hub on first use.
candle-probe = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:hf-hub", "dep:tokenizers"]
# DIR-004 Phase 1 ruling (Option B, structural separation, 2026-07-29):
# the Q9-gated user-capture module. Off by default and absent from every
# release/CI build command in this repo, so a pre-charter build cannot
# even compile a live user-capture path -- enforced mechanically by
# scripts/check-q9-capture-gate.sh, not left to convention. No deps of
# its own; gates utterance-engine::capture's module declaration itself.
q9-capture = []

[dependencies]
# GOV.2 pattern: exact rev pin, never path/[patch]; Candle-only slice.
ob-semantic-matcher = { git = "https://github.com/adamtc007/ob-poc-rust", rev = "ff3f12c7c0dfa4ac9c8a7bc086162fc2bcecb67e", default-features = false, optional = true }
designer-graph = { path = "../designer-graph" }
bpmn-lite-compiler = { path = "../bpmn-lite-compiler" }
bpmn-lite-types = { path = "../bpmn-lite-types" }
petgraph = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
blake3 = { workspace = true }
uuid = { workspace = true }
# candle-probe deps — same version pins as ob-semantic-matcher's Candle slice
# (matcher's Cargo.toml, ff3f12c) so cache/ABI stay aligned across features.
candle-core = { version = "0.8", optional = true }
candle-nn = { version = "0.8", optional = true }
candle-transformers = { version = "0.8", optional = true }
hf-hub = { version = "0.4", default-features = false, features = ["ureq"], optional = true }
tokenizers = { version = "0.20", optional = true }

[[example]]
name = "candle_loadability_probe"
required-features = ["candle-probe"]

[[example]]
name = "score_trained_bundle"
required-features = ["candle-probe"]

[[example]]
name = "starter_seed_eval"
required-features = ["embed", "candle-probe"]
