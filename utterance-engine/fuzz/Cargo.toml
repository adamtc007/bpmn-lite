[package]
name = "utterance-engine-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
utterance-engine = { path = ".." }
semantic-decision-contracts = { git = "https://github.com/adamtc007/dsl", rev = "ca006a785e1545cf71e2870c4dffe9d7bb5147e8" }

[[bin]]
name = "semantic_board_decode"
path = "fuzz_targets/semantic_board_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "phrase_index"
path = "fuzz_targets/phrase_index.rs"
test = false
doc = false
bench = false

[[bin]]
name = "workbook_transition"
path = "fuzz_targets/workbook_transition.rs"
test = false
doc = false
bench = false
