[package]
name = "utterance-engine-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
utterance-engine = { path = "..", features = ["candle-probe"] }
candle-core = "0.8"
semantic-decision-contracts = { git = "https://github.com/adamtc007/dsl", rev = "4858d305248f80f2035891b90c4474affb66ec8a" }
designer-graph = { path = "../../designer-graph" }
bpmn-lite-compiler = { path = "../../bpmn-lite-compiler" }
uuid = "1"

[[bin]]
name = "semantic_board_decode"
path = "fuzz_targets/semantic_board_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "phrase_index"
path = "fuzz_targets/phrase_index.rs"
test = false
doc = false
bench = false

[[bin]]
name = "workbook_transition"
path = "fuzz_targets/workbook_transition.rs"
test = false
doc = false
bench = false

[[bin]]
name = "v3_route_admission"
path = "fuzz_targets/v3_route_admission.rs"
test = false
doc = false
bench = false

[[bin]]
name = "legal_move_enumeration"
path = "fuzz_targets/legal_move_enumeration.rs"
test = false
doc = false
bench = false

[[bin]]
name = "preview_compilation"
path = "fuzz_targets/preview_compilation.rs"
test = false
doc = false
bench = false

[[bin]]
name = "evidence_fusion"
path = "fuzz_targets/evidence_fusion.rs"
