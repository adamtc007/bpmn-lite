[package]
name = "utterance-engine-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
utterance-engine = { path = "..", features = ["candle-probe"] }
candle-core = "0.8"
semantic-decision-contracts = { git = "https://github.com/adamtc007/dsl", rev = "1d039d958a91620ab15374f05176bdfac4c872d1" }
designer-graph = { path = "../../designer-graph" }
bpmn-lite-compiler = { path = "../../bpmn-lite-compiler" }
uuid = "1"

[[bin]]
name = "semantic_board_decode"
path = "fuzz_targets/semantic_board_decode.rs"
