[package]
name = "bpmn-lite-types-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.bpmn-lite-types]
path = ".."

[[bin]]
name = "canonical_decode"
