  - !State
    name: "BPMN_INSTANCE"
    type_name: "BPMN_INSTANCE"
  - !VerbLocal
    id: "define-template"
    inputs:
      - name: "template_key"
        type_name: "String"
        required: true
      - name: "plan_body"
        type_name: "String"
        required: true
    output:
      name: "template"
