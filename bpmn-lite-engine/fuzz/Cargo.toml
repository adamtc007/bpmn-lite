[package]
name = "bpmn-lite-engine-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
uuid = "1"
async-trait = "0.1"
# <1.53: rustc nightly (2026-07-17 AND 2026-07-24) ICEs compiling tokio
# 1.53's multi_thread runtime under cargo-fuzz's sancov flags
# (rustc_codegen_ssa operand.rs:291 "not immediate"). The bound caps the
# unified workspace resolution (engine's own `tokio = "1"` included); lift
# it once a nightly compiles tokio 1.53+ under -Cpasses=sancov-module.
tokio = { version = ">=1.38, <1.53", features = ["rt", "time", "macros"] }

[dependencies.bpmn-lite-engine]
path = ".."

[dependencies.bpmn-lite-store]
path = "../../bpmn-lite-store"

[dependencies.bpmn-lite-types]
path = "../../bpmn-lite-types"

[[bin]]
name = "engine_commands"
path = "fuzz_targets/engine_commands.rs"
test = false
doc = false
bench = false

[[bin]]
name = "engine_graph"
path = "fuzz_targets/engine_graph.rs"
test = false
doc = false
bench = false

[[bin]]
name = "xml_compile"
path = "fuzz_targets/xml_compile.rs"
test = false
doc = false
bench = false

[[bin]]
name = "engine_recovery"
path = "fuzz_targets/engine_recovery.rs"
test = false
doc = false
bench = false

[[bin]]
name = "engine_flagstorm"
path = "fuzz_targets/engine_flagstorm.rs"
test = false
doc = false
bench = false
