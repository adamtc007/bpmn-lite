[package]
name = "bpmn-lite-compiler-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"

[dependencies.bpmn-lite-compiler]
path = ".."

[dependencies.bpmn-lite-types]
path = "../../bpmn-lite-types"

[[bin]]
name = "dsl_compile"
path = "fuzz_targets/dsl_compile.rs"
test = false
doc = false
bench = false

[[bin]]
name = "plan_deserialize"
path = "fuzz_targets/plan_deserialize.rs"
test = false
doc = false
bench = false
