name: Layering guard

on:
  push:
    branches: [main]
  pull_request:

jobs:
  guard:
    name: bpmn-lite has no ob_poc_types dependency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: bytecodealliance/actions/wasmtime/setup@v1
      - name: Layering guard
        run: bash scripts/check-layering.sh
      - name: Glossary guard self-test (V&S §2, V1.5)
        run: bash scripts/check-glossary.sh --self-test
      - name: Glossary guard
        run: bash scripts/check-glossary.sh
      - name: Canonical hash-domain invariant guard self-test (D3 Ring 2, V2.1h.1/h.6)
        run: bash scripts/check-canonical-invariant.sh --self-test
      - name: Canonical hash-domain invariant guard
        run: bash scripts/check-canonical-invariant.sh
      - name: Deterministic kernel WASI Preview 2 build
        run: cargo build -p bpmn-lite-kernel --target wasm32-wasip2
      - name: Native/WASM replay byte equality
        run: |
          cargo run --quiet -p bpmn-lite-kernel --bin replay_fixture > native-replay.txt
          wasmtime target/wasm32-wasip2/debug/replay_fixture.wasm > wasm-replay.txt
          cmp native-replay.txt wasm-replay.txt

  fenced-transition:
    name: PostgreSQL migrations and stale-fence gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: bpmn_lite_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bpmn_lite_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      BPMN_LITE_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bpmn_lite_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run migrations, workspace tests, and stale-fence concurrency gate
        run: cargo test --workspace -- --test-threads=1
