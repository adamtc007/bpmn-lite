name: production-gates

on:
  pull_request:
  push:
    branches: [main]

jobs:
  rust-and-recovery:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: bpmn_lite_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d bpmn_lite_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      BPMN_LITE_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bpmn_lite_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bpmn_lite_test
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Layering and deterministic capability gate
        run: bash scripts/check-layering.sh
      - name: Shared-pin guard self-test
        run: bash scripts/check-shared-pin.sh --self-test
      - name: Shared-pin guard (dsl/sem_os revision, invariant 19)
        run: bash scripts/check-shared-pin.sh
      - name: Q9 capture-gate guard self-test
        run: bash scripts/check-q9-capture-gate.sh --self-test
      - name: Q9 capture-gate guard
        run: bash scripts/check-q9-capture-gate.sh
      - name: Install public API boundary checker
        run: cargo install cargo-public-api --version 0.52.0 --locked
      - name: Semantic Gameboard API and dependency boundary
        run: python3 scripts/check-semantic-gameboard-boundaries.py
      - name: Checked BPMN invocation-pack gate
        run: cargo run -p xtask -- pack-check bpmn
      - name: BPMN semantic mapper contract gates
        run: |
          cargo test -p utterance-engine property_tests
          cargo test -p utterance-engine bpmn_pack::tests::semantic_registry_exhaustively_covers_designer_catalogue -- --exact
          cargo test -p utterance-engine exact::tests::serializer_changes_with_semantic_fields_and_is_order_stable -- --exact
          cargo test -p utterance-engine pair::tests::pair_hash_is_deterministic_and_budget_bound -- --exact
          cargo test -p bpmn-lite-server-designer proposal::tests
      - name: Hermetic mapper bundle compatibility gate
        run: >-
          cargo test -p utterance-engine --features candle-probe
          trained_ranker::tests::bundle_with_old_candidate_serializer_is_refused_before_model_load
          -- --exact
      - name: Clippy
        # DIR-004 Phase 1.2: NOT --all-features -- that would silently
        # compile the Q9-gated capture module into every clippy/build/
        # test/doc pass this job runs, including the "production and demo
        # startup" step below that RUNS the built binary. Named features
        # only (every opt-in feature that exists workspace-wide today,
        # deliberately excluding q9-capture) -- check-q9-capture-gate.sh
        # (above) fails this job if a future --all-features creeps back in.
        run: cargo clippy --workspace --all-targets --features postgres,database,embed,candle-probe -- -D warnings
      - name: Workspace build
        run: cargo build --workspace --features postgres,database,embed,candle-probe
      - name: Production and demo startup fail-closed checks
        run: |
          if BPMN_LITE_ENV=production target/debug/bpmn-lite-server; then
            echo "production server started without mandatory configuration" >&2
            exit 1
          fi
          if BPMN_LITE_ENV=production target/debug/bpmn-lite-demo-runner; then
            echo "demo runner started in production mode" >&2
            exit 1
          fi
          if BPMN_LITE_ENV=production target/debug/bpmn-lite-demo-designer; then
            echo "demo designer started in production mode" >&2
            exit 1
          fi
      - name: Migrations, RLS, recovery, integration, and property tests
        run: cargo test --workspace --features postgres,database,embed,candle-probe -- --test-threads=1
      - name: Kernel WASI Preview 2 build
        run: cargo build -p bpmn-lite-kernel --target wasm32-wasip2
      - name: Fiber persistence codec benchmark
        run: bash scripts/check-benchmark-regression.sh
      - name: Generate BPMN mapper performance receipt
        run: >-
          cargo run --release -p utterance-engine
          --example semantic_perf_receipt
          > bpmn-mapper-performance.md
      - name: Upload BPMN mapper performance receipt
        uses: actions/upload-artifact@v4
        with:
          name: bpmn-mapper-performance
          path: bpmn-mapper-performance.md
      - name: v2 frame perf suite (frame ∝ live tokens; encode latency)
        run: cargo bench -p bpmn-lite-types --bench v2_perf
      - name: Public API documentation surface
        env:
          RUSTDOCFLAGS: -Dwarnings
        run: cargo doc --workspace --features postgres,database,embed,candle-probe --no-deps
      - name: Production gRPC wire smoke
        run: |
          BPMN_LITE_STORE=memory BPMN_LITE_BIND=127.0.0.1:50051 \
            cargo run -p bpmn-lite-server-runner --bin bpmn-lite-server > server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 60); do
            if grep -q 'gRPC server listening' server.log; then break; fi
            sleep 1
          done
          BPMN_LITE_URL=http://127.0.0.1:50051 \
            cargo test -p bpmn-lite-server-runner --test integration test_grpc_smoke -- --exact

  native-wasm-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: bytecodealliance/actions/wasmtime/setup@v1
      - name: Cross-implementation replay bytes
        run: |
          cargo run --quiet -p bpmn-lite-kernel --bin replay_fixture > native-replay.txt
          cargo build -p bpmn-lite-kernel --target wasm32-wasip2
          wasmtime target/wasm32-wasip2/debug/replay_fixture.wasm > wasm-replay.txt
          cmp native-replay.txt wasm-replay.txt

  # EOP-FUZZ F4: every committed fuzz-crash reproducer is a permanent,
  # governed blocking gate. Empty or unmanifested corpora fail closed.
  fuzz-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate governed regression inputs
        run: python3 scripts/check_fuzz_regressions.py
      - uses: dtolnay/rust-toolchain@stable
      # Pinned (not floating @nightly): cargo-fuzz's synthesized workspace
      # patches depend on the exact nightly's Cargo/rustc metadata output;
      # a moving nightly can silently reintroduce fuzz lockfile drift.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-03
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Run regression corpus
        run: cargo run -p xtask -- fuzz regress
      - name: Semantic-v3 route admission smoke
        run: |
          smoke_corpus=$(mktemp -d)
          cp utterance-engine/fuzz/seeds/v3_route_admission/v3-card-legacy-candidate.txt \
            "$smoke_corpus/seed"
          cd utterance-engine/fuzz
          cargo fuzz run v3_route_admission "$smoke_corpus" -- \
            -runs=64 -max_len=1024 -print_final_stats=1
      - name: Semantic Gameboard Phase 2 smokes
        run: |
          enumeration_corpus=$(mktemp -d)
          preview_corpus=$(mktemp -d)
          cp utterance-engine/fuzz/seeds/legal_move_enumeration/linear-anchored.bin \
            "$enumeration_corpus/seed"
          cp utterance-engine/fuzz/seeds/preview_compilation/insert-after.bin \
            "$preview_corpus/seed"
          cd utterance-engine/fuzz
          cargo fuzz run legal_move_enumeration "$enumeration_corpus" -- \
            -runs=64 -max_len=64 -print_final_stats=1
          cargo fuzz run preview_compilation "$preview_corpus" -- \
            -runs=64 -max_len=64 -print_final_stats=1
      - name: Semantic Gameboard Phase 3 evidence smoke
        run: |
          evidence_corpus=$(mktemp -d)
          cp utterance-engine/fuzz/seeds/evidence_fusion/* "$evidence_corpus/"
          cd utterance-engine/fuzz
          cargo fuzz run evidence_fusion "$evidence_corpus" -- \
            -runs=64 -max_len=256 -print_final_stats=1
