name: nightly-chaos

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

jobs:
  transition-cut-points:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: bpmn_lite_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d bpmn_lite_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      BPMN_LITE_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bpmn_lite_test
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Lease, timer, effect, duplicate, and recovery cut points
        run: |
          for pass in $(seq 1 20); do
            cargo test -p bpmn-lite-store-postgres \
              store_postgres::tests::test_fenced_transition_rejects_expired_owner -- --exact --test-threads=1
            cargo test -p bpmn-lite-store-postgres \
              store_postgres::tests::test_durable_timer_survives_transition_cut_points -- --exact --test-threads=1
            cargo test -p bpmn-lite-store-postgres \
              store_postgres::tests::test_durable_effect_commit_dispatch_inbox_and_consume -- --exact --test-threads=1
            cargo test -p bpmn-lite-store-postgres \
              store_postgres::tests::test_concurrent_claim_and_recovery -- --exact --test-threads=1
          done
      - name: Q9 capture-gate guard
        run: bash scripts/check-q9-capture-gate.sh
      - name: Full recovery matrix
        # DIR-004 Phase 1.2: named features, not --all-features -- see
        # production-gates.yml's identical note.
        run: cargo test --workspace --features postgres,database,embed,candle-probe -- --test-threads=1
