[package]
name = "bpmn-lite-store"
version = "0.1.0"
edition = "2021"
description = "BPMN-Lite typed persistence capabilities and in-memory backend."

# Capability discipline (Sage ACP / bpmn-lite restructure Phase 1):
#   IN-SCOPE  : typed store capability traits + `MemoryStore`
#               (in-process implementation used by tests and dev).
#   OUT-OF-SCOPE: PostgreSQL impl (bpmn-lite-store-postgres),
#                 schema migrations (also in -store-postgres),
#                 the bytecode interpreter (bpmn-lite-vm), the
#                 compiler (bpmn-lite-compiler).

[dependencies]
bpmn-lite-types = { path = "../bpmn-lite-types" }
async-trait = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }
blake3 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[lints]
workspace = true
