[package]
name = "bpmn-lite-store-postgres"
version = "0.1.0"
edition = "2021"
description = "BPMN-Lite PostgreSQL persistence backend and migrations."

# Capability discipline (Sage ACP / bpmn-lite restructure Phase 1):
#   IN-SCOPE  : implementations of the typed store capability traits,
#               schema migrations (under `./migrations/`), the
#               `LISTEN/NOTIFY` plumbing the gRPC server's event
#               fanout depends on.
#   OUT-OF-SCOPE: in-memory store (bpmn-lite-store), authoring's
#                 template store (bpmn-lite-authoring keeps its
#                 own template-postgres impl), runtime semantics
#                 (bpmn-lite-vm, bpmn-lite-engine).

[dependencies]
bpmn-lite-store = { path = "../bpmn-lite-store" }
bpmn-lite-types = { path = "../bpmn-lite-types" }
ffi-catalogue = { path = "../ffi-catalogue" }
ffi-types = { path = "../ffi-types" }
async-trait = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
blake3 = { workspace = true }

[dev-dependencies]
# H1 (EOP-PLAN-CRATE-HYGIENE-001): bpmn-lite-compiler, bpmn-lite-engine,
# bpmn-lite-kernel, bpmn-lite-vm and ffi-dispatcher were dev-deps only for
# the multi-crate application scenarios now moved to
# `xtask/tests/store_postgres_{engine_kernel,engine_fault_injection,
# bus_outbox}_vertical.rs`; the remaining SQL/persistence-contract tests
# here don't reach engine/compiler/kernel/FFI-dispatcher composition, so
# they're removed rather than left unused (bpmn-lite-authoring is
# unrelated pre-existing surface, left as-is).
bpmn-lite-authoring = { path = "../bpmn-lite-authoring" }
dsl-bus-storage = { path = "../dsl-bus-storage" }
tokio = { workspace = true, features = ["test-util"] }
blake3 = { workspace = true }

[lints]
workspace = true
